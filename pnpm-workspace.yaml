packages:
  - plugins/*
  - packages/*

# 共享版本表：各包 devDependencies / peerDependencies 用 "catalog:" 引用，
# 安装时由此解析。DSH 平台包必须同版本协同——升级平台时只改这一处。
catalog:
  '@deepseek-ai/cordis': ~4.0.4
  '@deepseek-ai/dsh-api-remotes': 0.1.7-rc.2
  '@deepseek-ai/dsh-api-session-controller': 0.1.7-rc.2
  '@deepseek-ai/dsh-client-ui-primitives': 0.1.7-rc.2
  '@deepseek-ai/dsh-client-ui-renderer': 0.1.7-rc.2
  '@deepseek-ai/dsh-client-ui-session': 0.1.7-rc.2
  '@deepseek-ai/dsh-client-ui-settings': 0.1.7-rc.2
  '@deepseek-ai/dsh-client-ui-slots': 0.1.7-rc.2
  '@deepseek-ai/dsh-client-ui-workspace': 0.1.7-rc.2
  '@deepseek-ai/dsh-credentials': 0.1.7-rc.2
  '@deepseek-ai/dsh-home-paths': 0.1.7-rc.2
  '@deepseek-ai/dsh-host-webserver': 0.1.7-rc.2
  '@deepseek-ai/dsh-llm': 0.1.7-rc.2
  '@deepseek-ai/dsh-mcp-client': 0.1.7-rc.2
  '@deepseek-ai/dsh-session': 0.1.7-rc.2
  '@deepseek-ai/dsh-user-questions': 0.1.7-rc.2
  '@types/node': ^26.6.2
  '@types/react': ~18.3.31
  '@types/react-dom': ~18.3.7
  lightningcss: ^1.33.0
  prettier: ^3.9.8
  react: ^18.3.1
  react-dom: ^18.3.1
  tsdown: ^0.23.0
  typescript: ^7.0.2
  vitest: ^3.2.4

# 单一消费者依赖不进 catalog，留在各插件 package.json：
#   dsh-models        yaml@2.9.1（client bundle 内联浏览器 ESM 构建）
#   dsh-zhipu-tools   clsx@^2.1.1（client bundle 白名单内联）
