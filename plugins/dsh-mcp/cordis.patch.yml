# dsh-mcp bundle patch
#
# 安装后（dependencies 与 dsh.profile.bundles 均含 dsh-mcp），启动时
# profile boot 合并本 patch，把插件行插入 host composition。只硬依赖
# webServer（HTTP 桥）；loader / tools / profileContext / hmr 服务均经
# ctx.get() 可选访问——官方 web/desktop 组合都提供，缺席时降级为
# 只读面板或明确报错，不影响加载。
- insert:
    - id: dsh-mcp
      name: 'dsh-mcp'
