# npm 暂存发布（staged publishing）：推送 v*.*.* 标签 → CI 暂存新版本 →
# 维护者审查后 npm stage approve --otp 才正式上线（npmjs.com 网页亦可审批）。
#
# 前置（一次性，网页操作）：
#   1. npmjs.com → Access Tokens → Granular Token：
#      Packages and scopes → Read and write (stage only)，
#      范围先选 All packages（包尚未存在时无法按名选择；首发后收窄到本包）。
#      stage-only token 泄露也无法直接上线版本，须经维护者 2FA 审批。
#   2. GitHub 仓库 → Settings → Secrets and variables → Actions →
#      新建 NPM_TOKEN（仓库级 Secret，仅本仓库可读）。
#   3. 注意：暂存发布要求包已存在于 registry——v0.1.0 首发必须直接发布
#      一次（建议本机 npm login 后手动 npm publish，全程不经宽权限 token），
#      之后的版本才走本 workflow 的暂存流程。
#
# 发布节奏：改 package.json version → 提交 → git tag vX.Y.Z →
# git push origin <branch> --tags → CI 暂存 → 本地 npm stage list 查看 →
# npm stage approve <stage-id> --otp 上线（或 npm stage reject 丢弃）。

name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm provenance（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 挂死保护：安装+测试+暂存远用不了这么久
    steps:
      - uses: actions/checkout@v7

      # 标签与版本一致性放在装依赖之前：不匹配立即失败，省掉安装时间。
      # runner 镜像预装 node，此步无需 setup-node。
      - name: Ensure tag matches package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      # packageManager 字段已固定 pnpm 版本，corepack 按它激活；
      # 须在 setup-node 之前，cache: pnpm 才能探测到包管理器。
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      # prepack 自动构建 lib/；暂存后需维护者 approve 才对公众可见。
      - run: npm stage publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
